schema_version = 1

[model]
namespace = "com.leylinedb"
language = 1
sources = ["model", "policy"]
# org.standards brings its rules, templates and shared shapes. Leyline can add
# rules in policy/ but cannot remove or weaken these (decision 47). Leyline
# declares its own ValidationException, with more reasons than the bundled
# crucible.errors one, so it does not import that package.
imports = ["org.standards"]

# The dependency entry pins the version (decision 60).
[model.dependencies]
"org.standards" = { path = "../standards" }

[model.naming]
input = "{Operation}Input"
output = "{Operation}Output"

# Compatibility is checked on every compile against the last release, a
# frozen copy made by `crucible freeze` (decision 47d), not only when someone
# runs `crucible diff`. This example ships no frozen release, so the baseline
# stays a comment; a real package would have it.
# [model.baseline]
# path = "releases/2026-09-04"
