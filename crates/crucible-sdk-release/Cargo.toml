[package]
name = "crucible-sdk-release"
description = "SDK release channels: reading the last release, choosing the next version, and resumable publishing to npm and git tags"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# URL rules shared with the SDK file's resolver: credential detection,
# redaction and host canonicalization.
crucible-codegen-common.workspace = true
base64 = "0.22"
flate2 = "1"
semver = { version = "1", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror.workspace = true
# HTTPS only, with rustls and no C toolchain; redirects are followed by
# `http::get`, which decides where a credential may go.
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"

[lints]
workspace = true
