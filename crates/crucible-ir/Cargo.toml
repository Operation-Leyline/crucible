[package]
name = "crucible-ir"
description = "The Crucible IR, release snapshots and the helpers every generator shares."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
readme.workspace = true
license-file.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[dependencies]
base64 = "0.22"
# Exact model numbers: the server's `DecimalValue` type, so a range check here
# agrees with the generated one.
bigdecimal.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "arbitrary_precision"] }
thiserror.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1"
# Finds `[Name]` doc links (decision 80) the way every renderer parses them.
pulldown-cmark = { version = "0.13", default-features = false }
url = "2"

[lints]
workspace = true
