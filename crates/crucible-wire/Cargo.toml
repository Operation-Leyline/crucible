[package]
name = "crucible-wire"
description = "What a crucible server and client share about the wire: operation descriptions, the error model, validation, timestamps and the JSON readers and writers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
readme.workspace = true
license-file.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[features]
mcp = ["dep:jsonschema"]

[dependencies]
jsonschema = { version = "0.26.2", default-features = false, optional = true }
base64 = "0.22"
bytes = "1"
bigdecimal.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true, features = ["arbitrary_precision"] }

[lints]
workspace = true

[dev-dependencies]
crucible-ir = { path = "../crucible-ir" }
