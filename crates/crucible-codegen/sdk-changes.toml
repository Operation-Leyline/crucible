# Generator and runtime changes that move generated SDKs
# (docs/sdk-packaging.md, "Generator change entries").
#
# A pull request that changes a generator's public output or a runtime's
# public API adds an entry: the next `id`, the languages whose SDKs it moves,
# its kind (`breaking`, `additive` or `patch`) and a one-line summary. The Rust
# SDK re-exports its whole runtime, so a change to that runtime's public API is
# a Rust entry; bundled runtimes and minimum toolchain versions count the same
# way. Entries are per language, never per feature, and ordered by `id`, not by
# Crucible version. Never renumber or remove an entry: every package's
# `crucible.json` records the highest `id` it was generated with.

[[change]]
id = 0
languages = ["rust", "ts", "python", "go", "java", "kotlin", "csharp", "swift", "dart", "php", "ruby", "cpp", "c", "r"]
kind = "patch"
summary = "The log begins. Changes before it are not recorded; packages generated before it carry no generatorChanges."

[[change]]
id = 1
languages = ["rust", "ts", "python", "go", "java", "kotlin", "csharp", "swift", "dart", "php", "ruby", "cpp", "c", "r"]
kind = "patch"
summary = "Built-in shape ids in bundled schemas are crucible.api, not smithy.api; generated docs and headers name the .cru model; Python and C# spans set rpc.system to crucible."

[[change]]
id = 2
languages = ["ts"]
kind = "breaking"
summary = "Document integers outside the safe range decode as bigint, Document admits bigint, and stringifyJson takes an optional space."

[[change]]
id = 3
languages = ["rust"]
kind = "patch"
summary = "Client-side validation names a sensitive map key as [key] in violation paths, and compares an integer member with a fractional or exponent range bound exactly."

[[change]]
id = 4
languages = ["rust"]
kind = "additive"
summary = "The runtime adds Document, a permissions module, validate::{Violations, MAX_VIOLATIONS} with Rejection::new and Validator::sensitive, and pagination, idempotency-token, permission and sender descriptions on Operation, ServiceInfo and OperationInfo."

[[change]]
id = 5
languages = ["rust", "ts", "python", "go", "java", "kotlin", "csharp", "swift", "dart", "php", "ruby", "cpp", "c", "r"]
kind = "patch"
summary = "Model text with line separators, a BOM, control or bidi characters, comment terminators, @-led lines or CRLF no longer breaks generated code: comments normalise it, doc tools read no stray tags, and string literals escape it."

[[change]]
id = 6
languages = ["rust", "ts", "python", "go"]
kind = "patch"
summary = "A modelled Content-Type member outranks the payload's media type, which outranks default headers; Rust and TypeScript clients no longer follow redirects."

[[change]]
id = 7
languages = ["rust", "ts", "python", "go", "java", "kotlin", "csharp", "swift", "dart", "php", "ruby", "cpp", "c", "r"]
kind = "additive"
summary = "A model with typed permissions gives the client open per-resource permission types with deprecated alias constants and a canonical mapping, a PERMISSIONS registry, and operation docs and a bundled schema that state the public requirements."

[[change]]
id = 8
languages = ["java", "kotlin", "csharp", "swift", "dart", "php", "ruby", "cpp", "c", "r"]
kind = "patch"
summary = "A modelled Content-Type member outranks the payload's media type, which outranks default headers; C# sends a modelled Content-Type as given."

[[change]]
id = 9
