[package]
name = "crucible-build"
description = "Compile Smithy sources and generate services, client SDKs, documents, infrastructure and CLI outputs from Cargo builds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
crucible-codegen-rust = { workspace = true, optional = true }
crucible-codegen = { workspace = true, default-features = false }
crucible-smithy.workspace = true
crucible-policy.workspace = true
crucible-traits.workspace = true
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
smithy-tooling = { workspace = true, optional = true }

[features]
default = ["smithy", "rust"]
rust = ["dep:crucible-codegen-rust", "crucible-codegen/rust"]
smithy = ["dep:smithy-tooling"]
all-clients = ["crucible-codegen/all-clients", "rust", "java", "ts", "python", "go", "csharp", "kotlin", "swift", "dart", "php", "ruby", "cpp", "c", "r"]
java = ["crucible-codegen/java"]
all-outputs = ["all-clients", "openapi", "cdk", "terraform", "cli"]
openapi = ["crucible-codegen/openapi"]
cdk = ["crucible-codegen/cdk"]
terraform = ["crucible-codegen/terraform"]
cli = ["crucible-codegen/cli"]
ts = ["crucible-codegen/ts"]
python = ["crucible-codegen/python"]
go = ["crucible-codegen/go"]
csharp = ["crucible-codegen/csharp"]
kotlin = ["crucible-codegen/kotlin"]
swift = ["crucible-codegen/swift"]
dart = ["crucible-codegen/dart"]
php = ["crucible-codegen/php"]
ruby = ["crucible-codegen/ruby"]
cpp = ["crucible-codegen/cpp"]
c = ["crucible-codegen/c"]
r = ["crucible-codegen/r"]

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
