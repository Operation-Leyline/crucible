[package]
name = "crucible-build"
description = "Compile Crucible language packages and generate services, client SDKs, documents, infrastructure and CLI outputs from Cargo builds"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
readme.workspace = true
license-file.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[dependencies]
crucible-codegen-rust = { workspace = true, optional = true }
crucible-codegen = { workspace = true, default-features = false }
crucible-lang.workspace = true
crucible-ir.workspace = true
crucible-policy.workspace = true
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }

[features]
default = ["rust"]
rust = ["dep:crucible-codegen-rust", "crucible-codegen/rust"]
all-clients = ["crucible-codegen/all-clients", "rust", "java", "ts", "python", "go", "csharp", "kotlin", "swift", "dart", "php", "ruby", "cpp", "c", "r"]
java = ["crucible-codegen/java"]
all-outputs = ["all-clients", "json-schema", "openapi", "docs", "cdk", "terraform", "cli"]
docs = ["crucible-codegen/docs"]
openapi = ["crucible-codegen/openapi"]
json-schema = ["crucible-codegen/json-schema"]
cdk = ["crucible-codegen/cdk"]
terraform = ["crucible-codegen/terraform"]
cli = ["crucible-codegen/cli"]
ts = ["crucible-codegen/ts"]
python = ["crucible-codegen/python"]
go = ["crucible-codegen/go"]
csharp = ["crucible-codegen/csharp"]
kotlin = ["crucible-codegen/kotlin"]
swift = ["crucible-codegen/swift"]
dart = ["crucible-codegen/dart"]
php = ["crucible-codegen/php"]
ruby = ["crucible-codegen/ruby"]
cpp = ["crucible-codegen/cpp"]
c = ["crucible-codegen/c"]
r = ["crucible-codegen/r"]

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
