[package]
name = "crucible-client"
description = "The runtime generated Rust clients use: transport, retries, idempotency tokens, error decoding, pagination"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
crucible-wire.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4", "fast-rng"] }
bytes = "1"
http = "1.5.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
# One crypto provider for rustls, with no C toolchain to build: rustls picks it
# as the process default when it is the only one enabled.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[lints]
workspace = true
