[package]
name = "crucible-auth"
description = "Opt-in JWT/OIDC verification and model-driven authenticator chains"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = []
test-support = ["dep:rsa", "dep:rand", "dep:base64", "dep:p256"]

[dependencies]
crucible-server-runtime-rust = { path = "../crucible-server-runtime-rust", default-features = false }
async-trait = "0.1"
axum = "0.8"
jsonwebtoken = { version = "9.3", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["sync", "time"] }
rsa = { version = "0.9", optional = true }
rand = { version = "0.8", optional = true }
base64 = { version = "0.22", optional = true }
p256 = { version = "0.13", features = ["pkcs8"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[lints]
workspace = true
