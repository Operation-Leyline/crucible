[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-client"
version = "0.0.0.dev0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "jmespath==1.0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"weather_client" = ["py.typed", "crucible.json"]
