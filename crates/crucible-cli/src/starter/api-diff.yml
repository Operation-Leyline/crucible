name: API compatibility

on:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Authenticate private tooling checkout
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.CRUCIBLE_APP_ID }}
          private-key: ${{ secrets.CRUCIBLE_APP_PRIVATE_KEY }}
          owner: Operation-Leyline
          repositories: |
            crucible
            crucible-actions
          permission-contents: read
      - uses: actions/checkout@v4
        with:
          repository: Operation-Leyline/crucible-actions
          ref: cbc01f24f7b6e3c4ed9014dcfdae1ea6e650dbb6
          token: ${{ steps.app-token.outputs.token }}
          path: crucible-actions
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: service
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: ./crucible-actions/setup-crucible
        id: tooling
        with:
          crucible-ref: __CRUCIBLE_REF__
          token: ${{ steps.app-token.outputs.token }}
      - name: Fetch service dependencies
        shell: bash
        env:
          CRUCIBLE_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: |
          # Authenticate fetches without persisting credentials for build scripts.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${CRUCIBLE_TOKEN}@github.com/Operation-Leyline/crucible.insteadOf"
          export GIT_CONFIG_VALUE_0=https://github.com/Operation-Leyline/crucible
          for checkout in baseline service; do
            (cd "$checkout" && cargo fetch --locked)
          done
      - uses: ./crucible-actions/api-diff
        env:
          CARGO_NET_OFFLINE: 'true'
        with:
          cli: ${{ steps.tooling.outputs.cli }}
          baseline-directory: baseline
          proposed-directory: service
          model-path: target/crucible-model.json
          build-command: cargo build --locked
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-diff-report
          path: api-diff-report
          if-no-files-found: ignore
