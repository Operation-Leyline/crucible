[package]
name = "crucible-server-runtime-rust"
description = "The Rust server runtime for APIs modelled in Crucible: phased pipeline, context, protocols, validation, errors, service log, hosting"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
readme.workspace = true
license-file.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[features]
# Both hosts by default, so moving a service between a container and Lambda
# is a deployment change, not a rebuild with different features.
default = ["http", "lambda"]
# A dedicated HTTP server: containers, ECS, a laptop.
http = ["dep:hyper", "dep:hyper-util", "tokio/net", "tokio/signal", "tokio/sync"]
# AWS Lambda: HTTP events (Function URLs, API Gateway, ALB) and direct JSON invokes.
lambda = ["dep:lambda_http", "dep:lambda_runtime", "dep:base64"]
logging = ["dep:tracing-subscriber"]
# Embedded local-development API explorer; never enabled by default.
explorer = ["dep:crucible-explorer-assets"]
# Sealed pagination tokens (`page_tokens`): authenticated encryption, so a
# service that does not page through it carries no cryptography.
page-tokens = ["dep:chacha20poly1305", "dep:hkdf", "dep:sha2", "dep:base64"]
# Server-side idempotency (`idempotency`): client tokens claimed in a store
# the service supplies, retries answered with the first success. SHA-256
# fingerprints the request, so a service without it carries no digest.
idempotency = ["dep:sha2"]
# Typed permissions (`permissions`): the `Permissions` interceptor enforcing
# the model's requirements through a service-supplied `Authorizer`, and the
# handler checks beside it. The requirement descriptions themselves are
# always present, since generated code states them.
permissions = []
# Test doubles, such as `MemoryIdempotencyStore`. Enable it from
# [dev-dependencies]: nothing in a production build needs it. (This crate's
# own tests always include it.)
test-support = []

[dependencies]
crucible-explorer-assets = { workspace = true, optional = true }
crucible-wire = { workspace = true, features = ["mcp"] }
async-trait = "0.1"
axum = "0.8"
http-body-util = "0.1"
hyper = { version = "1", optional = true, features = ["server", "http1"] }
hyper-util = { version = "0.1", optional = true, features = ["tokio"] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
lambda_http = { version = "1.3", optional = true, default-features = false, features = ["apigw_rest", "apigw_http", "alb"] }
lambda_runtime = { version = "1.4", optional = true }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "macros", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "fast-rng"] }
url = "2"
chacha20poly1305 = { version = "0.10", optional = true }
hkdf = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
