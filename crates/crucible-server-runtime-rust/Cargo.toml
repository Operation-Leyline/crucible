[package]
name = "crucible-server-runtime-rust"
description = "The Rust server runtime for Smithy-modelled APIs: phased pipeline, context, protocols, validation, errors, service log, hosting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Both hosts by default, so moving a service between a container and Lambda
# is a deployment change, not a rebuild with different features.
default = ["http", "lambda"]
# A dedicated HTTP server: containers, ECS, a laptop.
http = ["dep:hyper", "dep:hyper-util", "tokio/net", "tokio/signal", "tokio/sync"]
# AWS Lambda: HTTP events (Function URLs, API Gateway, ALB) and direct JSON invokes.
lambda = ["dep:lambda_http", "dep:lambda_runtime"]
logging = ["dep:tracing-subscriber"]
# The conformance harness that generated `smithy.test` vector tests call. Enable it
# from [dev-dependencies]: nothing in a production build needs it. (This crate's
# own tests always include it.)
test-support = []

[dependencies]
crucible-wire = { workspace = true, features = ["mcp"] }
async-trait = "0.1"
axum = "0.8"
http-body-util = "0.1"
hyper = { version = "1", optional = true, features = ["server", "http1"] }
hyper-util = { version = "0.1", optional = true, features = ["tokio"] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
lambda_http = { version = "1.3", optional = true, default-features = false, features = ["apigw_rest", "apigw_http", "alb"] }
lambda_runtime = { version = "1.4", optional = true }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "macros", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "fast-rng"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
