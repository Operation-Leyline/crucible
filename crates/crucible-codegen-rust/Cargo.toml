[package]
name = "crucible-codegen-rust"
description = "Rust service bindings and native Cargo client SDK packages for crucible"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
crucible-smithy.workspace = true
crucible-codegen-common.workspace = true
# Patterns are compiled at generation time, so one the generated server's
# regex crate cannot run is a diagnostic rather than a startup panic.
regex = "1"
semver = "1"
url = "2"
serde_json = { workspace = true, features = ["preserve_order"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
toml = "0.8"
