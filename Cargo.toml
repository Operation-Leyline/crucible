[workspace]
resolver = "3"
members = ["crates/*"]
# The end-to-end harness builds generated crates: its own workspace.
exclude = ["e2e"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
repository = "https://github.com/Operation-Leyline/crucible"

[workspace.dependencies]
crucible = { path = "crates/crucible" }
crucible-build = { path = "crates/crucible-build" }
crucible-codegen-rust = { path = "crates/crucible-codegen-rust" }
crucible-smithy = { path = "crates/crucible-smithy" }
crucible-codegen-ts = { path = "crates/crucible-codegen-ts" }
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
