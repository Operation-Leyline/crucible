[workspace]
resolver = "3"
members = ["crates/*", "smithy"]
# The end-to-end harness builds generated crates: its own workspace.
exclude = ["e2e", "vendor/smithy-tooling"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
publish = false
repository = "https://github.com/Operation-Leyline/crucible"

[workspace.dependencies]
crucible = { path = "crates/crucible" }
crucible-wire = { path = "crates/crucible-wire" }
crucible-client-runtime-rust = { path = "crates/crucible-client-runtime-rust" }
crucible-cli-runtime = { path = "crates/crucible-cli-runtime" }
crucible-codegen-cli = { path = "crates/crucible-codegen-cli" }
crucible-build = { path = "crates/crucible-build" }
crucible-policy = { path = "crates/crucible-policy" }
crucible-codegen-rust = { path = "crates/crucible-codegen-rust" }
crucible-smithy = { path = "crates/crucible-smithy" }
crucible-traits = { path = "smithy" }
smithy-tooling = { path = "vendor/smithy-tooling" }
crucible-codegen-ts = { path = "crates/crucible-codegen-ts" }
crucible-codegen-openapi = { path = "crates/crucible-codegen-openapi" }
crucible-codegen-infra = { path = "crates/crucible-codegen-infra" }
crucible-codegen-cdk = { path = "crates/crucible-codegen-cdk" }
crucible-codegen-terraform = { path = "crates/crucible-codegen-terraform" }
crucible-codegen-python = { path = "crates/crucible-codegen-python" }
crucible-codegen-common = { path = "crates/crucible-codegen-common" }
crucible-codegen-go = { path = "crates/crucible-codegen-go" }
crucible-codegen-java = { path = "crates/crucible-codegen-java" }
crucible-codegen-csharp = { path = "crates/crucible-codegen-csharp" }
crucible-codegen-kotlin = { path = "crates/crucible-codegen-kotlin" }
crucible-codegen-swift = { path = "crates/crucible-codegen-swift" }
crucible-codegen-cpp = { path = "crates/crucible-codegen-cpp" }
crucible-codegen-c = { path = "crates/crucible-codegen-c" }
crucible-codegen-r = { path = "crates/crucible-codegen-r" }
crucible-codegen-ruby = { path = "crates/crucible-codegen-ruby" }
crucible-codegen-php = { path = "crates/crucible-codegen-php" }
crucible-codegen-dart = { path = "crates/crucible-codegen-dart" }
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
# The runtime crates (crucible, crucible-wire, crucible-client-runtime-rust) must not turn
# on `preserve_order`: features unify across a consumer's build, and a
# service that hashes or compares JSON maps relies on their sorted order.
# The generators, which only run at build time, opt in for stable output.
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
