[package]
name = "weather-server"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
weather-api = { path = "../generated/weather-server" }
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
