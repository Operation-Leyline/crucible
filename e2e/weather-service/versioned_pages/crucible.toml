# Sealed page tokens across API versions: v1 is frozen under releases/; v2
# renames ListThings' token and pages ListTags, which v1 did not.
[model]
namespace = "test.versioned_pages"
imports = ["crucible.errors"]

[model.baseline]
path = "releases/v1.json"

[[exceptions]]
rule = "compatibility.pagination"
shape = "test.versioned_pages#ListTags"
reason = "This fixture intentionally adds pagination to exercise sealed tokens at older versions; its callers explicitly handle paged results."
