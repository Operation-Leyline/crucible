# A service package: depends on the model package, generates its operations
# in build.rs, implements them, and hosts the result.
[package]
name = "weather-service"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
crucible = { path = "../../crates/crucible" }
weather-model = { path = "../weather-model" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[build-dependencies]
crucible-build = { path = "../../crates/crucible-build" }

[dev-dependencies]
crucible-client-runtime-rust = { path = "../../crates/crucible-client-runtime-rust" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
serde = "1"
axum = "0.8"
criterion = { version = "0.7", default-features = false, features = ["async_tokio"] }
base64 = "0.22"
flate2 = "1"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }

[[bench]]
name = "requests"
harness = false

[[bench]]
name = "allocations"
harness = false
