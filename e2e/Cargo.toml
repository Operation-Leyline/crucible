# The end-to-end harness: a model package and a service package, built the
# way a real service is (see tools/test-e2e.sh). Its own workspace, so the
# main workspace builds without generated code.
[workspace]
resolver = "3"
members = ["weather-client", "weather-model", "weather-service"]

# As the main workspace: no unsafe code (benches count allocations with
# stats_alloc's instrumented allocator instead of their own).
[workspace.lints.rust]
unsafe_code = "forbid"
