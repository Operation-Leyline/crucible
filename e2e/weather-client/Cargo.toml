# A client package: depends on the model package and generates a client for
# it in build.rs. Its tests drive the weather service over real HTTP.
[package]
name = "weather-client"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
crucible-client-runtime-rust = { path = "../../crates/crucible-client-runtime-rust" }
weather-model = { path = "../weather-model" }

[build-dependencies]
crucible-build = { path = "../../crates/crucible-build" }
serde_json = "1"

[dev-dependencies]
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
crucible = { path = "../../crates/crucible" }
reqwest = { version = "0.13.5", default-features = false }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
weather-service = { path = "../weather-service" }
