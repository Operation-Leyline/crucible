# The service crate: depends on the model crate, generates its bindings in
# build.rs, and implements them with the extension points real services use.
[package]
name = "leyline-service"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
crucible-server-runtime-rust = { path = "../../../../crates/crucible-server-runtime-rust" }
crucible-auth = { path = "../../../../crates/crucible-auth" }
leyline-model = { path = "../leyline-model" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }

[build-dependencies]
crucible-build = { path = "../../../../crates/crucible-build" }

[dev-dependencies]
crucible-auth = { path = "../../../../crates/crucible-auth", features = ["test-support"] }
serde_json = "1"
