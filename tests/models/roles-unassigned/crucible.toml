schema_version = 1

# `roles.unassigned` and `roles.assigns` (docs/roles.md §4.5): an operation
# whose input carries role values, or that writes a resource holding them,
# says what it assigns; and what an `assigns` clause names is a member of
# role values and a resource of the service.
[model]
namespace = "example.shop"
language = 1
sources = ["."]
imports = []

[model.naming]
input = "{Operation}Input"
output = "{Operation}Output"
