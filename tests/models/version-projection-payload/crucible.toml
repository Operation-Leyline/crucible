# A retyped payload (decision 72): v2 retypes a request payload from a PNG
# blob to a string, a response payload from a string to a PDF blob, and a
# JSON body member of a CSV string into a spreadsheet `@payload`, so the
# projection of v1 binds each as v1 did (a payload's kind and media type, or
# no payload at all) and sends the Content-Type that follows. PutNote's
# payload becomes a JSON body member beside a member added since, which
# does not reach v1: its request has no body to carry it (decision 74).
# Each `retype` declares the binding change it causes, so the guard needs
# no exception (#348). v1 is frozen under releases/; v2 is current.
[model]
namespace = "example.payload"

[model.baseline]
path = "releases/v1.json"
