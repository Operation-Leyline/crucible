# Release history in the reference (docs/api-versions-clients.md, "API
# documentation across releases"): three releases, every kind of migration
# step across the two migrations, an operation retired under an exception,
# and steps on internal API that only the internal reference lists, among
# them steps on public API that name internal API on one side (an internal
# enum value or error added, a reshape of an internal member, a rename and
# a retype of a member internal before). v1 and v2 are frozen under
# releases/; v3 is current.
#
# A reference fixture, not a server one: `retype PutItem.output.total ->
# string` names a declared conversion, which the Rust server generator does
# not generate yet (as in tests/models/version-steps).
[model]
namespace = "example.history"

[model.baseline]
path = "releases/v2.json"

[[exceptions]]
rule = "compatibility.operation"
shape = "example.history#PingItems"
reason = "PingItems is retired at every release"

[[exceptions]]
rule = "compatibility.sdk"
shape = "example.history#PingItems"
reason = "PingItems is retired at every release"

[[exceptions]]
rule = "compatibility.sdk"
shape = "example.history#PingItemsOutput"
reason = "PingItems is retired at every release"
