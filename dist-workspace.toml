[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.1"
# release.yml owns qualification, the tag and the single GitHub Release.
# build-cli.yml invokes dist directly and uploads files for that release.
ci = []
hosting = ["github"]
create-release = false
packages = ["crucible-cli"]
installers = ["shell", "powershell"]
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
install-path = "CARGO_HOME"
install-updater = false
checksum = "sha256"
source-tarball = false
# Resolve inherited workspace assets from this config, not a package-relative path.
auto-includes = false
include = ["README.md", "LICENSE", "NOTICE"]
