name: Release Crucible

on:
  workflow_dispatch:
    inputs:
      version:
        description: Merged workspace version to release (for example 0.1.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crucible-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false, fetch-depth: 0 }
      # crucible_release.py and package_starter.py need 3.11+ (tomllib); do not
      # depend on the runner image's python3, which LINUX_RUNNER may change.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - name: Verify the merged version and unused release tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Release the merged version from main.' >&2
            exit 1
          fi
          python3 tools/crucible_release.py check "$RELEASE_VERSION"
          if git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            echo "v$RELEASE_VERSION already exists." >&2
            exit 1
          fi
  # The full matrix, including the `consumers` job (starter, example service and
  # the Leyline-shaped fixture) on this exact commit. publish needs it, so no tag
  # exists for a commit whose stable surface its consumers cannot build.
  # ci.yml also owns lean Cargo profiles, shared consumer targets and disk measurements.
  qualify:
    needs: preflight
    uses: ./.github/workflows/ci.yml
  cli-artifacts:
    needs: preflight
    uses: ./.github/workflows/build-cli.yml
    with:
      version: ${{ inputs.version }}
  # Only this job can request an OIDC token: it runs no repository code, just
  # downloads the qualified CLI archives and attests them.
  attest-cli:
    needs: [preflight, qualify, cli-artifacts]
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: crucible-cli-release
          path: dist/cli
      # cargo-dist's per-target manifests are build records, not release assets.
      - run: rm -f dist/cli/*-dist-manifest.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/cli/*
  publish:
    needs: [preflight, qualify, cli-artifacts, attest-cli]
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - uses: ./.github/actions/qualification-tools
      - name: Package the matching starter
        run: |
          python3 tools/package_starter.py --cli "$CRUCIBLE_BIN"
          python3 tools/package_starter.py --cli "$CRUCIBLE_BIN" --client
        env:
          CARGO_BUILD_JOBS: '2'
      - uses: actions/download-artifact@v8
        with:
          pattern: crucible-lsp-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: crucible-cli-release
          path: dist/cli
      # Publish exactly what attest-cli attested.
      - run: rm -f dist/cli/*-dist-manifest.json
      - name: Publish the tested commit as a GitHub tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # Create the ref atomically: a tag appearing during qualification
          # must not redirect the release to an untested commit.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/v$RELEASE_VERSION" -f "sha=$GITHUB_SHA"
          gh release create "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Crucible $RELEASE_VERSION" --generate-notes \
            "dist/hello-service-v$RELEASE_VERSION.zip" \
            "dist/hello-client-v$RELEASE_VERSION.zip" \
            dist/crucible-lsp-*.zip dist/cli/*
