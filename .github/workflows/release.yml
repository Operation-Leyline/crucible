name: Release Crucible

on:
  workflow_dispatch:
    inputs:
      version:
        description: Merged workspace version to release (for example 0.1.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crucible-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Verify the merged version and unused release tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Release the merged version from main.' >&2
            exit 1
          fi
          python3 tools/crucible_release.py check "$RELEASE_VERSION"
          if git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            echo "v$RELEASE_VERSION already exists." >&2
            exit 1
          fi
  qualify:
    needs: preflight
    uses: ./.github/workflows/ci.yml
  publish:
    needs: [preflight, qualify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: ./.github/actions/qualification-tools
      - name: Package the matching starter
        run: |
          python3 tools/package_starter.py --cli "$CRUCIBLE_BIN"
          python3 tools/package_starter.py --cli "$CRUCIBLE_BIN" --client
        env:
          CARGO_BUILD_JOBS: '2'
      - uses: actions/download-artifact@v4
        with:
          name: smithy-cargo-plugin
          path: dist
      - name: Publish the tested commit as a GitHub tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # Create the ref atomically: a tag appearing during qualification
          # must not redirect the release to an untested commit.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/v$RELEASE_VERSION" -f "sha=$GITHUB_SHA"
          gh release create "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Crucible $RELEASE_VERSION" --generate-notes \
            "dist/hello-service-v$RELEASE_VERSION.zip" \
            "dist/hello-client-v$RELEASE_VERSION.zip" dist/smithy-cargo-0.1.0.zip
