name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift-linux:
    runs-on: ubuntu-latest
    container: swift:6.0.3-jammy
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: apt-get update && apt-get install -y build-essential curl python3
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python3 tools/test-swift.py
  swift-apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: swift --version
      - run: python3 tools/test-swift.py
        env:
          SWIFT_TEST_OUTPUT: ${{ runner.temp }}/crucible-swift
      - name: Build the generated package for iOS Simulator
        working-directory: ${{ runner.temp }}/crucible-swift/sdk
        run: xcodebuild -scheme Weather -destination 'generic/platform=iOS Simulator' -derivedDataPath '${{ runner.temp }}/swift-ios' CODE_SIGNING_ALLOWED=NO build
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: python tools/test-kotlin.py
  kotlin-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          disable-animations: true
          script: python tools/test-kotlin-android.py
  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: python tools/test-csharp.py
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: python tools/test-java.py
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with: { go-version: '1.24.x', cache: false }
      - run: python tools/test-go.py
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install 'httpx>=0.28,<1' mypy build
      - run: python tools/test-python.py
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked
      - run: python -m unittest discover -s tools -p "test_*.py"

  # The generated TypeScript client, compiled and run against a fake fetch.
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bash tools/test-ts.sh

  # The example service (e2e/): built the way a real one is, tested in
  # process, then served and driven by the generated TypeScript client.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ". -> target\ne2e -> target" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cargo fmt --all --check --manifest-path e2e/Cargo.toml
      - run: cargo clippy --manifest-path e2e/Cargo.toml --all-targets --locked -- -D warnings
      - run: bash tools/test-e2e.sh
