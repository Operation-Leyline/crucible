name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: python tools/test-java.py
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with: { go-version: '1.24.x', cache: false }
      - run: python tools/test-go.py
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install 'httpx>=0.28,<1' mypy build
      - run: python tools/test-python.py
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked
      - run: python -m unittest discover -s tools -p "test_*.py"

  # The generated TypeScript client, compiled and run against a fake fetch.
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bash tools/test-ts.sh

  # The example service (e2e/): built the way a real one is, tested in
  # process, then served and driven by the generated TypeScript client.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ". -> target\ne2e -> target" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cargo fmt --all --check --manifest-path e2e/Cargo.toml
      - run: cargo clippy --manifest-path e2e/Cargo.toml --all-targets --locked -- -D warnings
      - run: bash tools/test-e2e.sh
