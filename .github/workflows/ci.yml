name: CI

on:
  pull_request:
    # Drafts run nothing; marking a PR ready for review qualifies it.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Weekly, every language on Linux: PRs build only the languages their paths
  # touch, so a generator or runtime break elsewhere would otherwise wait for
  # the next release. macOS, Windows and Android stay release-only (minutes).
  schedule:
    - cron: '17 5 * * 1'
  # Qualify a repair branch on every platform without starting a release.
  workflow_dispatch:
  # The manual version-release workflow calls this with the full matrix.
  workflow_call:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Release qualification calls this workflow, so it uses the same lean profiles.
env:
  CARGO_BUILD_JOBS: '3'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

# Linux jobs run on GitHub-hosted runners unless the repository variables
# LINUX_RUNNER / LINUX_RUNNER_2204 (and LINUX_RUNNER_2404 in sdk-release.yml)
# name another runner label, e.g. ubicloud-standard-2. Unset them to switch back.
jobs:
  # PRs qualify affected Linux consumers; manual releases use the full matrix.
  plan:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      full: ${{ steps.select.outputs.full }}
      tools: ${{ steps.select.outputs.tools }}
      c: ${{ steps.select.outputs.c }}
      consumers: ${{ steps.select.outputs.consumers }}
      cdk: ${{ steps.select.outputs.cdk }}
      cpp: ${{ steps.select.outputs.cpp }}
      csharp: ${{ steps.select.outputs.csharp }}
      dart: ${{ steps.select.outputs.dart }}
      e2e: ${{ steps.select.outputs.e2e }}
      onboarding: ${{ steps.select.outputs.onboarding }}
      editor: ${{ steps.select.outputs.editor }}
      go: ${{ steps.select.outputs.go }}
      java: ${{ steps.select.outputs.java }}
      kotlin: ${{ steps.select.outputs.kotlin }}
      php: ${{ steps.select.outputs.php }}
      python: ${{ steps.select.outputs.python }}
      r: ${{ steps.select.outputs.r }}
      ruby: ${{ steps.select.outputs.ruby }}
      rust: ${{ steps.select.outputs.rust }}
      service_cli: ${{ steps.select.outputs.service_cli }}
      swift: ${{ steps.select.outputs.swift }}
      terraform: ${{ steps.select.outputs.terraform }}
      typescript: ${{ steps.select.outputs.typescript }}
      docs_site: ${{ steps.select.outputs.docs_site }}
      onboarding_hosts: ${{ steps.select.outputs.onboarding_hosts }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false, fetch-depth: 0 }
      - id: select
        run: python3 tools/ci_plan.py
  # Jammy binaries run on both Jammy consumers (including Swift's container)
  # and newer Ubuntu hosts. Artifacts are scoped to this run and exact SHA.
  qualification-tools:
    needs: plan
    if: needs.plan.outputs.rust == 'true' && needs.plan.outputs.tools == 'true'
    runs-on: ${{ vars.LINUX_RUNNER_2204 || 'ubuntu-22.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { shared-key: qualification-tools-jammy, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - name: Build the generator and HTTP fixture once
        run: |
          cargo build --locked -p crucible-cli
          cargo build --locked --manifest-path e2e/Cargo.toml -p weather-service
          mkdir -p dist/qualification-tools
          cp target/debug/crucible e2e/target/debug/weather-service dist/qualification-tools/
          strip dist/qualification-tools/*
          ldd dist/qualification-tools/*
        env:
          CARGO_BUILD_JOBS: '2'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-tools-linux-${{ github.sha }}
          overwrite: true
          path: dist/qualification-tools/*
          if-no-files-found: error
          # Kept two days for PR reruns; releases keep it longer.
          retention-days: ${{ github.event_name == 'pull_request' && 2 || 7 }}
  service-cli:
    needs: [plan, rust, qualification-tools]
    if: always() && !cancelled() && needs.rust.result == 'success' && needs.plan.outputs.service_cli == 'true' && (needs.qualification-tools.result == 'success' || needs.plan.outputs.tools != 'true')
    runs-on: ${{ matrix.os == 'ubuntu-latest' && (vars.LINUX_RUNNER || 'ubuntu-latest') || matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.full == 'true' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/qualification-tools
        if: runner.os == 'Linux' && needs.plan.outputs.tools == 'true'
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - name: Qualify generated CLI and MCP stdio over fixture and Weather HTTP
        run: python tools/test-cli.py
        env:
          CARGO_BUILD_JOBS: '2'
  cdk:
    needs: [plan, rust, qualification-tools]
    if: always() && !cancelled() && needs.rust.result == 'success' && needs.plan.outputs.cdk == 'true' && (needs.qualification-tools.result == 'success' || needs.plan.outputs.tools != 'true')
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/qualification-tools
        if: runner.os == 'Linux' && needs.plan.outputs.tools == 'true'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ". -> target/cdk-consumer-rust", save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '8.0.x' }
      - uses: actions/setup-go@v7
        with: { go-version: '1.26.x', cache: false }
      - run: python tools/test-cdk.py --language all --work-dir "$RUNNER_TEMP/cdk-consumer"
        env:
          CARGO_BUILD_JOBS: '2'
  terraform:
    needs: [plan, rust]
    if: needs.plan.outputs.terraform == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      matrix:
        engine: ${{ fromJSON(needs.plan.outputs.full == 'true' && '["terraform", "tofu"]' || '["terraform"]') }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: native, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: actions/setup-go@v7
        with: { go-version: '1.26.x', cache: false }
      - uses: hashicorp/setup-terraform@v4
        if: matrix.engine == 'terraform'
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - uses: opentofu/setup-opentofu@v2
        if: matrix.engine == 'tofu'
        with:
          tofu_version: '1.10.6'
          tofu_wrapper: false
      - run: python tools/test-terraform.py
        env:
          CARGO_BUILD_JOBS: '2'
          TERRAFORM: '${{ matrix.engine }}'
  c-linux:
    needs: [plan, rust, qualification-tools]
    if: always() && !cancelled() && needs.rust.result == 'success' && needs.plan.outputs.c == 'true' && (needs.qualification-tools.result == 'success' || needs.plan.outputs.tools != 'true')
    runs-on: ${{ vars.LINUX_RUNNER_2204 || 'ubuntu-22.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/qualification-tools
        if: runner.os == 'Linux' && needs.plan.outputs.tools == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
        with: { shared-key: native-jammy, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: sudo apt-get update && sudo apt-get install -y gcc cmake libcurl4-openssl-dev libssl-dev
      - run: python3 tools/install-yyjson.py --root target/yyjson --prefix target/yyjson/install
      - run: python3 tools/test-c.py
        env:
          C_SANITIZE: '1'
          CARGO_BUILD_JOBS: '2'
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/target/yyjson/install
  r:
    needs: [plan, rust, qualification-tools]
    if: always() && !cancelled() && needs.rust.result == 'success' && needs.plan.outputs.r == 'true' && (needs.qualification-tools.result == 'success' || needs.plan.outputs.tools != 'true')
    runs-on: ${{ vars.LINUX_RUNNER_2204 || 'ubuntu-22.04' }}
    timeout-minutes: 40
    strategy:
      matrix:
        r: ${{ fromJSON(needs.plan.outputs.full == 'true' && '["4.1.3", "release"]' || '["release"]') }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/qualification-tools
        if: runner.os == 'Linux' && needs.plan.outputs.tools == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
        with: { shared-key: native-jammy, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev
      - run: Rscript -e 'install.packages(c("curl", "jsonlite", "openssl"), repos="https://cloud.r-project.org")'
      - run: python3 tools/test-r.py
        env:
          CARGO_BUILD_JOBS: '2'
  cpp-linux:
    needs: [plan, rust, qualification-tools]
    if: always() && !cancelled() && needs.rust.result == 'success' && needs.plan.outputs.cpp == 'true' && (needs.qualification-tools.result == 'success' || needs.plan.outputs.tools != 'true')
    runs-on: ${{ vars.LINUX_RUNNER_2204 || 'ubuntu-22.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/qualification-tools
        if: runner.os == 'Linux' && needs.plan.outputs.tools == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
        with: { shared-key: native-jammy, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: sudo apt-get update && sudo apt-get install -y g++ cmake libcurl4-openssl-dev libssl-dev
      - run: python3 tools/test-cpp.py
        env:
          CPP_SANITIZE: '1'
          CARGO_BUILD_JOBS: '2'
  c-windows:
    needs: [plan, rust]
    if: needs.plan.outputs.c == 'true' && needs.plan.outputs.full == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: 19780d9cdf84d0944cf9a318666703b89ab6629c
          path: target/vcpkg
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: '${{ runner.temp }}/cpp-vcpkg-cache'
          key: 'cpp-vcpkg-windows-${{ hashFiles(''tools/cpp-vcpkg/vcpkg.json'') }}'
      - name: Build native dependencies
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'cpp-vcpkg-cache'
          New-Item -ItemType Directory -Force $cache | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = $cache
          $env:VCPKG_MAX_CONCURRENCY = '2'
          & target/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/vcpkg/vcpkg.exe install --triplet x64-windows --x-manifest-root=tools/cpp-vcpkg --x-install-root=target/cpp-dependencies
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE/target/vcpkg/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
          "VCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/target/cpp-dependencies" >> $env:GITHUB_ENV
      - run: python tools/install-yyjson.py --root target/yyjson --prefix target/yyjson/install
      - run: python tools/test-c.py
        env:
          CARGO_BUILD_JOBS: '2'
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/target/yyjson/install
  cpp-windows:
    needs: [plan, rust]
    if: needs.plan.outputs.cpp == 'true' && needs.plan.outputs.full == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: 19780d9cdf84d0944cf9a318666703b89ab6629c
          path: target/vcpkg
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: '${{ runner.temp }}/cpp-vcpkg-cache'
          key: 'cpp-vcpkg-windows-${{ hashFiles(''tools/cpp-vcpkg/vcpkg.json'') }}'
      - name: Build native dependencies
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'cpp-vcpkg-cache'
          New-Item -ItemType Directory -Force $cache | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = $cache
          $env:VCPKG_MAX_CONCURRENCY = '2'
          & target/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/vcpkg/vcpkg.exe install --triplet x64-windows --x-manifest-root=tools/cpp-vcpkg --x-install-root=target/cpp-dependencies
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE/target/vcpkg/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
          "VCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/target/cpp-dependencies" >> $env:GITHUB_ENV
      - run: python tools/test-cpp.py
        env:
          CARGO_BUILD_JOBS: '2'
  ruby:
    needs: [plan, rust, qualification-tools]
    if: always() && !cancelled() && needs.rust.result == 'success' && needs.plan.outputs.ruby == 'true' && (needs.qualification-tools.result == 'success' || needs.plan.outputs.tools != 'true')
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      matrix:
        ruby: ${{ fromJSON(needs.plan.outputs.full == 'true' && '["3.3", "4.0"]' || '["3.3"]') }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/qualification-tools
        if: runner.os == 'Linux' && needs.plan.outputs.tools == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
        with: { shared-key: native, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '${{ matrix.ruby }}' }
      - run: python3 tools/test-ruby.py
  php:
    needs: [plan, rust, qualification-tools]
    if: always() && !cancelled() && needs.rust.result == 'success' && needs.plan.outputs.php == 'true' && (needs.qualification-tools.result == 'success' || needs.plan.outputs.tools != 'true')
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      matrix:
        php: ${{ fromJSON(needs.plan.outputs.full == 'true' && '["8.3", "8.5"]' || '["8.3"]') }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/qualification-tools
        if: runner.os == 'Linux' && needs.plan.outputs.tools == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
        with: { shared-key: native, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: curl, json, zip
          tools: composer:v2
          coverage: none
      - run: python3 tools/test-php.py
  dart:
    needs: [plan, rust, qualification-tools]
    if: always() && !cancelled() && needs.rust.result == 'success' && needs.plan.outputs.dart == 'true' && (needs.qualification-tools.result == 'success' || needs.plan.outputs.tools != 'true')
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      matrix:
        sdk: ${{ fromJSON(needs.plan.outputs.full == 'true' && '["3.6.2", "stable"]' || '["3.6.2"]') }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/qualification-tools
        if: runner.os == 'Linux' && needs.plan.outputs.tools == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
        with: { shared-key: native, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: dart-lang/setup-dart@v1
        with: { sdk: '${{ matrix.sdk }}' }
      - run: python3 tools/test-dart.py
  swift-linux:
    needs: [plan, rust, qualification-tools]
    if: always() && !cancelled() && needs.rust.result == 'success' && needs.plan.outputs.swift == 'true' && (needs.qualification-tools.result == 'success' || needs.plan.outputs.tools != 'true')
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    container: swift:6.0.3-jammy
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/qualification-tools
        if: runner.os == 'Linux' && needs.plan.outputs.tools == 'true'
      - run: apt-get update && apt-get install -y build-essential curl python3
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: python3 tools/test-swift.py
  swift-apple:
    needs: [plan, rust]
    if: needs.plan.outputs.swift == 'true' && needs.plan.outputs.full == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: swift --version
      - run: python3 tools/test-swift.py
        env:
          SWIFT_TEST_OUTPUT: ${{ runner.temp }}/crucible-swift
      - name: Build the generated package for iOS Simulator
        working-directory: ${{ runner.temp }}/crucible-swift/sdk
        run: xcodebuild -scheme Weather -destination 'generic/platform=iOS Simulator' -derivedDataPath '${{ runner.temp }}/swift-ios' CODE_SIGNING_ALLOWED=NO build
  kotlin:
    needs: [plan, rust, qualification-tools]
    if: always() && !cancelled() && needs.rust.result == 'success' && needs.plan.outputs.kotlin == 'true' && (needs.qualification-tools.result == 'success' || needs.plan.outputs.tools != 'true')
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/qualification-tools
        if: runner.os == 'Linux' && needs.plan.outputs.tools == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
        with: { shared-key: native, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - run: python tools/test-kotlin.py
  kotlin-multiplatform:
    needs: [plan, rust, qualification-tools]
    if: always() && !cancelled() && needs.rust.result == 'success' && needs.plan.outputs.kotlin == 'true' && (needs.qualification-tools.result == 'success' || needs.plan.outputs.tools != 'true')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.full == 'true' && '[{"os":"ubuntu-latest","flags":""},{"os":"macos-14","flags":"--native"},{"os":"windows-latest","flags":"--native"}]' || '[{"os":"ubuntu-latest","flags":""}]') }}
    runs-on: ${{ matrix.os == 'ubuntu-latest' && (vars.LINUX_RUNNER || 'ubuntu-latest') || matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/qualification-tools
        if: runner.os == 'Linux' && needs.plan.outputs.tools == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
        with: { shared-key: native, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          # Saved from main only: PR-scoped Gradle caches evict main's.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      # setup-gradle caches ~/.gradle, but the native compiler keeps its
      # distribution, LLVM/sysroots and commonization results in ~/.konan.
      # Downloaded archives are already unpacked under ~/.konan/dependencies.
      - uses: actions/cache/restore@v6
        id: konan
        if: matrix.flags == '--native'
        with:
          path: |
            ~/.konan
            !~/.konan/dependencies/cache
          key: konan-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/crucible-codegen-kotlin/runtime/build.gradle.kts', 'crates/crucible-codegen-kotlin/tests/multiplatform/build.gradle.kts') }}
      - name: Check pinned Gradle launcher precedence
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tools -p "test_kotlin_tools.py"
      - name: Consume published JVM, JavaScript, and host-native artifacts
        run: python tools/test-kotlin-multiplatform.py ${{ matrix.flags }}
      # Archiving ~/.konan on Windows can outlast the build; bound it so a slow
      # upload never cancels a passing qualification.
      - uses: actions/cache/save@v6
        if: matrix.flags == '--native' && steps.konan.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        timeout-minutes: 15
        continue-on-error: true
        with:
          path: |
            ~/.konan
            !~/.konan/dependencies/cache
          key: konan-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/crucible-codegen-kotlin/runtime/build.gradle.kts', 'crates/crucible-codegen-kotlin/tests/multiplatform/build.gradle.kts') }}
  kotlin-android:
    needs: [plan, rust, qualification-tools]
    if: always() && !cancelled() && needs.rust.result == 'success' && needs.plan.outputs.kotlin == 'true' && (needs.qualification-tools.result == 'success' || needs.plan.outputs.tools != 'true') && needs.plan.outputs.full == 'true'
    # The emulator needs KVM, which only GitHub-hosted runners are known to expose.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/qualification-tools
        if: runner.os == 'Linux' && needs.plan.outputs.tools == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
        with: { shared-key: native, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: '8.13' }
      - name: Free space for Android userdata
        run: |
          # API 24+ emulators allocate at least 6 GiB plus startup headroom.
          sudo rm -rf /usr/share/dotnet
          df -h "$RUNNER_TEMP"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          disk-size: 6G
          disable-animations: true
          script: python tools/test-kotlin-android.py
  csharp:
    needs: [plan, rust, qualification-tools]
    if: always() && !cancelled() && needs.rust.result == 'success' && needs.plan.outputs.csharp == 'true' && (needs.qualification-tools.result == 'success' || needs.plan.outputs.tools != 'true')
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/qualification-tools
        if: runner.os == 'Linux' && needs.plan.outputs.tools == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
        with: { shared-key: native, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '8.0.x' }
      - run: python tools/test-csharp.py
  java:
    needs: [plan, rust, qualification-tools]
    if: always() && !cancelled() && needs.rust.result == 'success' && needs.plan.outputs.java == 'true' && (needs.qualification-tools.result == 'success' || needs.plan.outputs.tools != 'true')
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/qualification-tools
        if: runner.os == 'Linux' && needs.plan.outputs.tools == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
        with: { shared-key: native, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/maven-repo
          key: maven-qualification-${{ runner.os }}-${{ hashFiles('crates/crucible-codegen-java/src/**', 'tools/test-java.py') }}
          restore-keys: maven-qualification-${{ runner.os }}-
      - run: python tools/test-java.py
  go:
    needs: [plan, rust, qualification-tools]
    if: always() && !cancelled() && needs.rust.result == 'success' && needs.plan.outputs.go == 'true' && (needs.qualification-tools.result == 'success' || needs.plan.outputs.tools != 'true')
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/qualification-tools
        if: runner.os == 'Linux' && needs.plan.outputs.tools == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
        with: { shared-key: native, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: actions/setup-go@v7
        with: { go-version: '1.24.x', cache: false }
      - run: python tools/test-go.py
  python:
    needs: [plan, rust, qualification-tools]
    if: always() && !cancelled() && needs.rust.result == 'success' && needs.plan.outputs.python == 'true' && (needs.qualification-tools.result == 'success' || needs.plan.outputs.tools != 'true')
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/qualification-tools
        if: runner.os == 'Linux' && needs.plan.outputs.tools == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
        with: { shared-key: native, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - run: python -m pip install 'httpx>=0.28,<1' 'jmespath==1.0.1' mypy build
      - run: python tools/test-python.py
  rust:
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      CRUCIBLE_TEST_TARGET_DIR: ${{ github.workspace }}/target/consumer-tests
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Measure disk and remove unused runner SDKs
        run: |
          df -h /
          sudo du -sh /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          # This Rust-only job does not use .NET, Android, Haskell or CodeQL.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Disk after clippy
        run: |
          df -h /
          du -sh target
      # Java named SDK variants and every client adapter are feature gated.
      - name: Workspace tests including all native SDK build adapters
        run: cargo test --all-features --locked
      - name: Disk after independent consumer tests
        if: always()
        run: |
          df -h /
          du -sh target 2>/dev/null || true
          du -sh target/consumer-tests 2>/dev/null || true
      - name: Compiler-free minimal build helpers
        run: |
          cargo check -p crucible-build --no-default-features --locked
          cargo check -p crucible-codegen --no-default-features --locked
          cargo check -p crucible-build --no-default-features --features java --locked
          cargo tree -p crucible-build --no-default-features --features java --edges normal,build | (! grep crucible-codegen-rust)
      - run: python tools/test-api-policy.py
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/consumer-tests
      # Native consumer checks share the separate example workspace.
      - run: cargo metadata --manifest-path e2e/Cargo.toml --locked --format-version 1 > /dev/null
      - run: python -m unittest discover -s tools -p "test_*.py"
      - name: Final disk headroom
        if: always()
        run: |
          df -h /
          du -sh target 2>/dev/null || true
          du -sh target/consumer-tests 2>/dev/null || true
          du -sh e2e/target 2>/dev/null || true

  # The generated TypeScript client, compiled and run against a fake fetch.
  typescript:
    needs: [plan, rust, qualification-tools]
    if: always() && !cancelled() && needs.rust.result == 'success' && needs.plan.outputs.typescript == 'true' && (needs.qualification-tools.result == 'success' || needs.plan.outputs.tools != 'true')
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/qualification-tools
        if: runner.os == 'Linux' && needs.plan.outputs.tools == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Linux' || needs.plan.outputs.tools != 'true'
        with: { shared-key: native, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: bash tools/test-ts.sh

  # The static API reference renderer, run under Node's built-in test runner
  # against the generator's describe.json goldens.
  docs-site:
    needs: [plan, rust]
    if: needs.plan.outputs.docs_site == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: bash tools/test-docs-site.sh

  # The example service (e2e/): built the way a real one is, tested in
  # process, then served and driven by the generated TypeScript client.
  e2e:
    needs: [plan, rust]
    if: needs.plan.outputs.e2e == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ". -> target\ne2e -> target", save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: cargo fmt --all --check --manifest-path e2e/Cargo.toml
      - run: cargo clippy --manifest-path e2e/Cargo.toml --all-targets --locked -- -D warnings
      - run: bash tools/test-e2e.sh

  # The stable surface, built the way downstream services build it: the
  # `crucible new` starter, e2e/weather-*, and a Leyline-shaped fixture
  # (tests/consumers/leyline). One OS. The script builds with `-D deprecated`,
  # so the in-repo consumers stay on the current API; those flags change every
  # fingerprint, so this job keeps a cache of its own instead of sharing e2e's.
  # Always runs at release qualification, so a tag is never created for a
  # commit that breaks them.
  consumers:
    needs: [plan, rust]
    if: needs.plan.outputs.consumers == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: consumers, workspaces: ". -> target\ne2e -> target", save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: python3 tools/test-consumers.py
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_INCREMENTAL: '0'

  editor:
    needs: [plan, rust]
    if: needs.plan.outputs.editor == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      # Restored everywhere, saved from main only: a PR-scoped copy of this
      # 1.3 GB SDK is invisible to other PRs and evicts main's caches.
      - uses: actions/cache/restore@v6
        id: sdk
        with:
          path: .sdk/rustrover
          key: rustrover-linux-262.10968.75-fac0d503
      - name: Download the pinned IDE SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 https://download.jetbrains.com/rustrover/RustRover-2026.2.3.tar.gz --output /tmp/rustrover-sdk.tar.gz
          python3 - <<'PY'
          import hashlib, pathlib
          path = pathlib.Path('/tmp/rustrover-sdk.tar.gz')
          with path.open('rb') as source:
              digest = hashlib.file_digest(source, 'sha256').hexdigest()
          assert digest == 'fac0d50307301ecdb69998feeb338f1287a96e9c02d205165ec4e1d8c0ed40a6', digest
          PY
          mkdir -p .sdk/rustrover
          tar -xzf /tmp/rustrover-sdk.tar.gz --strip-components=1 -C .sdk/rustrover
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.sdk.outputs.cache-hit != 'true'
        with:
          path: .sdk/rustrover
          key: rustrover-linux-262.10968.75-fac0d503
      - run: python ide/smithy-cargo/build.py --ide-home .sdk/rustrover --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: smithy-cargo-plugin
          path: dist/smithy-cargo-0.1.0.zip

  # The language server for editors, per platform, built on release (full)
  # runs only. The release attaches these; the crucible-intellij plugin
  # bundles them.
  lsp-binaries:
    needs: [plan, rust]
    if: needs.plan.outputs.rust == 'true' && needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: linux }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15 }
          - { target: x86_64-pc-windows-msvc, os: windows-2022 }
    runs-on: ${{ matrix.os == 'linux' && (vars.LINUX_RUNNER || 'ubuntu-latest') || matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - run: cargo build --locked --release -p crucible-lsp --target ${{ matrix.target }}
        env:
          CARGO_BUILD_JOBS: '2'
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - run: python tools/package_lsp.py --target ${{ matrix.target }} --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: crucible-lsp-${{ matrix.target }}
          path: dist/crucible-lsp-${{ matrix.target }}.zip
          overwrite: true
  onboarding:
    needs: [plan, rust]
    if: needs.plan.outputs.onboarding == 'true'
    runs-on: ${{ matrix.os == 'ubuntu-latest' && (vars.LINUX_RUNNER || 'ubuntu-latest') || matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Provisioning is host-specific: PRs that change it and full runs
        # qualify every host; other PRs qualify Linux (tools/ci_plan.py).
        # The fallback keeps a skipped plan (draft PRs) from failing to expand
        # the matrix, which GitHub evaluates before the job's `if`.
        os: ${{ fromJSON(needs.plan.outputs.onboarding_hosts || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - run: python tools/test-onboarding.py
        env:
          CARGO_BUILD_JOBS: '2'

  # A stable aggregate reports failures while allowing intentionally omitted jobs.
  ci:
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: [plan, qualification-tools, service-cli, cdk, terraform, c-linux, r, cpp-linux, c-windows, cpp-windows, ruby, php, dart, swift-linux, swift-apple, kotlin, kotlin-multiplatform, kotlin-android, csharp, java, go, python, rust, typescript, docs-site, e2e, consumers, onboarding, editor, lsp-binaries]
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Check selected jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = [name for name, job in results.items() if job["result"] not in {"success", "skipped"}]
          if results["plan"]["result"] != "success" or results["rust"]["result"] != "success" or (results["plan"]["outputs"]["tools"] == "true" and results["qualification-tools"]["result"] != "success"):
              failed.append("required planner/Rust/tools gate")
          # Release qualification (full) never tags a commit the consumers cannot build.
          if results["plan"]["outputs"]["full"] == "true" and results["consumers"]["result"] != "success":
              failed.append("required consumers gate")
          if failed:
              raise SystemExit("CI failed: " + ", ".join(failed))
          PY
